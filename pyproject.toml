[project]
name = "enterprise-cafeteria-kakao-bot"
version = "0.1.0"
description = "사내 그룹웨어 식단표 OCR 및 카카오톡 챗봇 스킬 서버"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "playwright>=1.55,<2",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
menu-bot = "menu_bot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menu_bot"]

